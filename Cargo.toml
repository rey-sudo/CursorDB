[package]
name = "cursor_db"
version = "0.1.1"
edition = "2024"
authors = ["Juan Caballero <sudo.delete.evil@gmail.com>"]
description = "Cursor-based database engine. Append-only. Deterministic. Sparse index. Timestamp primary index."
license = "GPL-3.0"
repository = "https://github.com/rey-sudo"
readme = "README.md"
keywords = ["database", "storage", "timeseries", "cursor"]
categories = ["database-implementations", "data-structures"]

[dependencies]
crc32fast = "1.5.0"
serde = { version = "1.0.228", features = ["derive"] }